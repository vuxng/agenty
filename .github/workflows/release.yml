name: Release

# Every merge into stable is a release: build, sign with Developer ID, notarize, then tag
# v<MARKETING_VERSION> and publish a GitHub Release. The tag is created last, so a failed
# run leaves nothing behind and can be re-run with workflow_dispatch.
on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  XCODE_APP: /Applications/Xcode_27.2.app
  TEAM_ID: 8WJ6LC5Z59
  SIGN_IDENTITY: "Developer ID Application: Vu Nguyen (8WJ6LC5Z59)"
  # build-release.sh stops before building if signing or notary credentials are missing.
  REQUIRE_NOTARIZATION: "1"
  # SHA-256 of Apple's Developer ID G2 intermediate. G1 has the same name, so match the hash.
  DEVELOPER_ID_G2_SHA256: F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A

jobs:
  release:
    if: github.ref == 'refs/heads/stable'
    # Same macOS 27 preview image as CI; see ci.yml.
    runs-on: xcode-27
    environment: release
    # Notarization is capped at 1h by build-release.sh; this bounds the rest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require macOS 27
        run: |
          version="$(sw_vers -productVersion)"
          if [ "${version%%.*}" -lt 27 ]; then
            echo "::error::Runner has macOS $version; a release needs macOS 27."
            exit 1
          fi

      - name: Check version
        id: version
        run: scripts/check-version.sh

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Test UsageCore
        run: swift test --package-path Packages/UsageCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/agenty-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          if security find-certificate -a -Z -c "Developer ID Certification Authority" 2>/dev/null \
              | grep -F "SHA-256 hash: $DEVELOPER_ID_G2_SHA256" >/dev/null; then
            echo "Developer ID G2 intermediate is already installed."
          else
            curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046  # intentional word splitting of the existing keychain list
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Only this step sees the key's contents; the build gets a path to it.
      - name: Write notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "$VERSION"

      - name: Verify Gatekeeper
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/verify"
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "build/Agenty-$VERSION-arm64.zip" "$RUNNER_TEMP/verify"
          assessment="$(spctl --assess --type execute -vv "$RUNNER_TEMP/verify/Agenty.app" 2>&1 || true)"
          echo "$assessment"
          if [[ "$assessment" != *"source=Notarized Developer ID"* ]]; then
            echo "::error::Gatekeeper does not report a notarized Developer ID app."
            exit 1
          fi
          xcrun stapler validate "$RUNNER_TEMP/verify/Agenty.app"

      # The same notes GitHub would generate; they go to both the release and the appcast.
      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes"
          -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body > build/notes.md

      # Only this step sees the Sparkle key; make-appcast.sh reads it from stdin and checks the
      # signature against the app's SUPublicEDKey before writing build/appcast.xml.
      - name: Make appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | scripts/make-appcast.sh "$VERSION"

      - name: Publish release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$VERSION"

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
