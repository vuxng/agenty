name: CI

on:
  push:
    branches: [next, stable]
  pull_request:
    branches: [next, stable]

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  build:
    # `xcode-27` is GitHub's preview image (macOS 27, arm64). `macos-latest` is still macOS 26,
    # which cannot run a macOS 27 deployment target. Switch back to `macos-latest` once it is 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # Runs build-release.sh against a stubbed toolchain; needs macOS (plutil), not 27.
      - name: Test build-release
        run: bash scripts/test-build-release.sh

      # Needs macOS too: plutil, xmllint and CryptoKit (through swift).
      - name: Test make-appcast
        run: bash scripts/test-make-appcast.sh

      - name: Check macOS version
        id: guard
        run: |
          version="$(sw_vers -productVersion)"
          major="${version%%.*}"
          if [ "$major" -lt 27 ]; then
            echo "::notice::Runner has macOS $version; Agenty needs macOS 27 or newer. Skipping build and tests."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 27.2
        if: steps.guard.outputs.supported == 'true'
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Test UsageCore
        if: steps.guard.outputs.supported == 'true'
        run: swift test --package-path Packages/UsageCore

      - name: Install XcodeGen
        if: steps.guard.outputs.supported == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.guard.outputs.supported == 'true'
        run: xcodegen generate

      - name: Build app
        if: steps.guard.outputs.supported == 'true'
        run: >
          xcodebuild -project Agenty.xcodeproj -scheme Agenty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to match local development; the image's own ShellCheck is older and
      # reports different warnings.
      - name: Lint scripts (ShellCheck 0.11.0)
        run: |
          pipx run --spec shellcheck-py==0.11.0.1 shellcheck --version
          pipx run --spec shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

      - name: Test check-version
        run: bash scripts/test-check-version.sh

      - name: Test publish-release
        run: bash scripts/test-publish-release.sh

      - name: Test release secrets wizard
        run: bash scripts/test-setup-release-secrets.sh
