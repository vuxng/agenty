name: CI

on:
  push:
    branches: [next, stable]
  pull_request:
    branches: [next, stable]

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  build:
    # `xcode-27` is GitHub's preview image (macOS 27, arm64). `macos-latest` is still macOS 26,
    # which cannot run a macOS 27 deployment target. Switch back to `macos-latest` once it is 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Check macOS version
        id: guard
        run: |
          version="$(sw_vers -productVersion)"
          major="${version%%.*}"
          if [ "$major" -lt 27 ]; then
            echo "::notice::Runner has macOS $version; Agenty needs macOS 27 or newer. Skipping build and tests."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 27.2
        if: steps.guard.outputs.supported == 'true'
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Test UsageCore
        if: steps.guard.outputs.supported == 'true'
        run: swift test --package-path Packages/UsageCore

      - name: Install XcodeGen
        if: steps.guard.outputs.supported == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.guard.outputs.supported == 'true'
        run: xcodegen generate

      - name: Build app
        if: steps.guard.outputs.supported == 'true'
        run: >
          xcodebuild -project Agenty.xcodeproj -scheme Agenty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Test check-version
        run: bash scripts/test-check-version.sh

  version-check:
    # A PR into stable is a release: MARKETING_VERSION must be new and greater than the last tag.
    if: github.event_name == 'pull_request' && github.base_ref == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release version
        run: scripts/check-version.sh
