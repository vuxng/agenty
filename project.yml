name: Agenty
options:
  developmentLanguage: en
  knownRegions: [en, vi, Base]
  deploymentTarget:
    macOS: "27.0"
packages:
  UsageCore:
    path: Packages/UsageCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Agenty:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: UsageCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Agenty
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/vuxng/agenty/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        # Always ask before installing: hide Sparkle's "Automatically download and install" option.
        SUAllowsAutomaticUpdates: false
        SUPublicEDKey: VSzgrFXaXPBnifZoaF6tUenSC/Elaacp/IVhDdSJ3hs=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vuxng.Agenty
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: 0.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
