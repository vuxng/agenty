name: Agenty
options:
  developmentLanguage: en
  knownRegions: [en, vi, Base]
  deploymentTarget:
    macOS: "27.0"
packages:
  UsageCore:
    path: Packages/UsageCore
targets:
  Agenty:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: UsageCore
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Agenty
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vuxng.Agenty
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
